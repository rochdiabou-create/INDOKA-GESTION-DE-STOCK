<style>
:root{color-scheme:light dark;--bg:#eef1f4;--cd:#fff;--tx:#16202a;--mu:#5b6877;--bd:#d6dde4;--ac:#0b5d73;--pn:#0b3b4a;--pt:#eaf6f8;--ok:#1a7347;--wa:#a15c00;--ko:#b42318;--sl:#e1eef2;font:14px/1.4 "Segoe UI Variable","Segoe UI",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0f161c;--cd:#17212a;--tx:#e6edf3;--mu:#93a3b2;--bd:#27333e;--ac:#5cc4dc;--pn:#0d2f3a;--ok:#4cc38a;--wa:#f0b24a;--ko:#ff8a7a;--sl:#1a3340}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--cd);border-bottom:1px solid var(--bd)}
h1{font-size:19px;margin:0}h2{font-size:15px;margin:0 0 10px}
.mu{color:var(--mu)}
.kpi{display:flex;gap:10px}.kpi div{padding:6px 14px;border:1px solid var(--bd);border-radius:8px;color:var(--mu);font-size:12px}
.kpi b{display:block;font-size:20px;color:var(--tx);font-variant-numeric:tabular-nums}
main{display:grid;grid-template-columns:minmax(290px,360px) 1fr;gap:16px;padding:16px 20px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:16px}
.pn{background:var(--pn);color:var(--pt);border-radius:14px;padding:16px}
.pn .mu{color:#a9cdd6}.pn code{display:block;margin-top:8px;font-size:11px;word-break:break-all;color:#c7e3ea}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--cd)}
.pn input{background:#fff;color:#16202a;border-color:transparent}
#scan{font-size:22px;padding:14px;font-weight:600;font-variant-numeric:tabular-nums}
.big{font-size:46px;font-weight:700;line-height:1;margin:10px 0 2px;font-variant-numeric:tabular-nums}.big small{font-size:14px;font-weight:400;color:#a9cdd6}
.row{display:grid;grid-template-columns:80px 1fr 1fr;gap:8px;margin-top:12px}
#hint{font-size:12px;margin-top:6px;color:#a9cdd6}
button{padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--ac)}
button.p{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:600}
.in,.out{color:#fff;font-weight:600;border-color:transparent}.in{background:#1a7347}.out{background:#b42318}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.pn :focus-visible{outline-color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.tools .sp{flex:1}
.tools input{width:190px}.tools select{width:auto}
.tw{overflow:auto;max-height:calc(100vh - 190px);background:var(--cd);border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--bd)}
th{position:sticky;top:0;background:var(--cd);color:var(--mu);font-size:12.5px;white-space:nowrap}
.n{text-align:right;font-variant-numeric:tabular-nums}td.m{font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover,tr.s{background:var(--sl)}tr.s{box-shadow:inset 3px 0 var(--ac)}
.bd{padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid currentColor}
.ok{color:var(--ok)}.wa{color:var(--wa)}.ko{color:var(--ko)}
ul{list-style:none;margin:0;padding:0;font-size:12.5px}li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd)}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--cd);color:var(--tx);padding:18px;width:min(560px,94vw)}dialog::backdrop{background:#0009}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g label{font-size:12px;color:var(--mu)}.g .w{grid-column:1/-1}.ac{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#st{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw}
#st.on{opacity:1}#st.ok{border-left:5px solid var(--ok)}#st.ko{border-left:5px solid var(--ko)}
.pr{display:none}
@media print{:root{--bg:#fff;--cd:#fff;--tx:#000;--mu:#444;--bd:#bbb;--sl:#fff}header .kpi,#side,.tools,#st{display:none!important}main{display:block;padding:0}.pr{display:block}.tw{max-height:none;overflow:visible;border:0}th{position:static}tr{break-inside:avoid}body{font-size:11px}tr.s{box-shadow:none}}
</style>
</head>

const SOMME_SI=(rng,crit,som)=>som.reduce((t,v,i)=>rng[i]===crit?t+v:t,0);
function load(){try{const j=localStorage.getItem(KEY);if(j)return JSON.parse(j)}catch(e){}return{p:DATA,mv:[]}}
let S=load(),sel=null,mode='e',hist=[],edit=null,stT,delT;

const snap=()=>{hist.push(JSON.stringify(S));if(hist.length>50)hist.shift()};

const calc=(p,I=idx())=>{const e=SOMME_SI(I.b,p.b,I.e),s=SOMME_SI(I.b,p.b,I.s);return{e,s,r:p.i0+e-s}};

function render(){
 const I=idx(),q=$('#q').value.trim().toLowerCase(),cur=$('#cf').value,cs=[...new Set(S.p.map(p=>p.c))].sort();

 let units=0,out=0;const rows=S.p.map(p=>({p,...calc(p,I)}));
 rows.forEach(x=>{units+=x.r;if(x.r<=x.p.mi)out++});
 $('#tb').innerHTML=rows.filter(({p})=>(!cur||p.c===cur)&&(!q||(p.n+p.b+p.c).toLowerCase().includes(q))).map(({p,e,s,r})=>{
  const t=r<=p.mi?['Rupture','ko']:r>p.ma?['Surstock','wa']:['OK','ok'];
  return`<tr data-b="${esc(p.b)}" class="${p.b===sel?'s':''}"><td>${esc(p.c)}<td class="m">${esc(p.b)}<td>${esc(p.n)}<td>${esc(p.m)}<td class="n">${p.i0}<td class="n">${e}<td class="n">${s}<td class="n"><b>${r}</b><td><span class="bd ${t[1]}">${t[0]}</span>`}).join('')||'<tr><td colspan="9" class="mu">Aucun produit ne correspond à la recherche.';
 $('#k1').textContent=S.p.length;$('#k2').textContent=units;$('#k3').textContent=out;
 $('#pd').textContent=new Date().toLocaleDateString('fr-FR');
 $('#hint').textContent='La touche Entrée valide une '+(mode==='e'?'entrée':'sortie')+'.';
 const p=prod(sel),k=p&&calc(p,I);
 $('#sel').innerHTML=p?`<b>${esc(p.n)}</b><div class="mu">${esc(p.c)}, code ${esc(p.b)}</div><div class="big">${k.r}<small> en stock</small></div><code>=${p.i0}+SOMME.SI(MOUVEMENTS!B:B;${esc(p.b)};MOUVEMENTS!D:D)-SOMME.SI(MOUVEMENTS!B:B;${esc(p.b)};MOUVEMENTS!E:E)<br>= ${p.i0} + ${k.e} − ${k.s}</code>`:'<span class="mu">Scannez un code ou cliquez sur une ligne du tableau.</span>';
 $('#log').innerHTML=S.mv.slice(-8).reverse().map(x=>`<li><span>${new Date(x.d).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})} ${esc(x.n)}</span><b class="${x.e?'ok':'ko'}">${x.e?'+'+x.e:'−'+x.s}</b>`).join('')||'<li class="mu">Aucun mouvement pour le moment.';
}
function pick(b){sel=b;render();const q=$('#qty');q.focus();q.select();const r=$('tr.s');if(r)r.scrollIntoView({block:'nearest'})}
function mov(t){
 const p=prod(sel);if(!p)return say('Scannez ou sélectionnez d’abord un produit.','ko');
 const q=parseInt($('#qty').value);if(!(q>0))return say('Saisissez une quantité supérieure à 0.','ko');
 const r=calc(p).r;if(t==='s'&&q>r)return say(`Sortie impossible : il reste ${r} en stock.`,'ko');
 snap();S.mv.push({d:new Date().toISOString(),b:p.b,n:p.n,e:t==='e'?q:0,s:t==='s'?q:0});
 mode=t;$('#qty').value=1;commit();say(`${t==='e'?'Entrée':'Sortie'} enregistrée : ${q} × ${p.n}`,'ok');$('#scan').focus();
}
function openDlg(p,code){

function editSel(){prod(sel)?openDlg(prod(sel)):say('Sélectionnez d’abord un produit.','ko')}
function saveP(){

 if(!o.b||!o.n)return say('Le code-barres et la désignation sont obligatoires.','ko');
 if(S.p.some(x=>x.b===o.b&&x!==edit))return say('Ce code-barres existe déjà.','ko');

 sel=o.b;$('#dlg').close();commit();say(edit?'Produit modifié.':'Produit ajouté.','ok');
}
function del(){
 const b=$('#bd');if(!prod(sel))return say('Sélectionnez d’abord un produit.','ko');
 if(!delT){b.textContent='Confirmer ?';delT=setTimeout(()=>{delT=0;b.textContent='✕ Supprimer'},3000);return}
 clearTimeout(delT);delT=0;b.textContent='✕ Supprimer';snap();
 S.p=S.p.filter(x=>x.b!==sel);S.mv=S.mv.filter(x=>x.b!==sel);sel=null;commit();say('Produit supprimé. Utilisez Annuler pour le restaurer.','ok');
}
function undo(){if(!hist.length)return say('Aucune action à annuler.','ko');S=JSON.parse(hist.pop());if(!prod(sel))sel=null;commit();say('Dernière action annulée.','ok')}

const crc=(()=>{const t=[...Array(256)].map((_,n)=>{let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;return c>>>0});return u=>{let c=-1;for(const b of u)c=t[(c^b)&255]^(c>>>8);return(c^-1)>>>0}})();
function zip(files){
 const te=new TextEncoder(),parts=[],cd=[],n=Object.keys(files).length;let off=0;
 for(const[k,s]of Object.entries(files)){
  const nb=te.encode(k),d=te.encode(s),c=crc(d),h=new DataView(new ArrayBuffer(30)),e=new DataView(new ArrayBuffer(46));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nb.length,true);
  e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint32(16,c,true);e.setUint32(20,d.length,true);e.setUint32(24,d.length,true);e.setUint16(28,nb.length,true);e.setUint32(42,off,true);
  parts.push(new Uint8Array(h.buffer),nb,d);cd.push(new Uint8Array(e.buffer),nb);off+=30+nb.length+d.length;
 }
 const z=new DataView(new ArrayBuffer(22));z.setUint32(0,0x06054b50,true);z.setUint16(8,n,true);z.setUint16(10,n,true);z.setUint32(12,cd.reduce((a,x)=>a+x.length,0),true);z.setUint32(16,off,true);
 return new Blob([...parts,...cd,new Uint8Array(z.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const X=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function cell(r,c,v,f){
 const a=String.fromCharCode(65+c)+r;
 if(f)return`<c r="${a}"><f>${X(f)}</f><v>${v}</v></c>`;
 if(typeof v==='number')return`<c r="${a}"><v>${v}</v></c>`;
 if(/^\d{1,15}$/.test(v))return`<c r="${a}" s="1"><v>${v}</v></c>`;
 return`<c r="${a}" t="inlineStr"><is><t>${X(v)}</t></is></c>`;
}

async function save(){

 const M=[['Date','Code-barres','Désignation','Entrée','Sortie'],...S.mv.map(x=>[new Date(x.d).toLocaleString('fr-FR'),x.b,x.n,x.e,x.s])];
